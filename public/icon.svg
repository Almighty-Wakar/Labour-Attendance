<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171717"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- Construction Hardhat Crown -->
  <path d="M 140 270 C 140 180, 200 130, 256 130 C 312 130, 372 180, 372 270 Z" fill="url(#gold)"/>
  
  <!-- Hardhat Center Ridge -->
  <path d="M 244 130 L 268 130 L 270 270 L 242 270 Z" fill="#d97706" opacity="0.6"/>

  <!-- Hardhat Brim -->
  <rect x="110" y="264" width="292" height="32" rx="16" fill="url(#gold)"/>
  <rect x="100" y="278" width="312" height="18" rx="9" fill="#d97706"/>

  <!-- Attendance Checklist Board Accent -->
  <rect x="186" y="320" width="140" height="90" rx="14" fill="#262626" stroke="#404040" stroke-width="4"/>
  <rect x="236" y="306" width="40" height="14" rx="4" fill="#fbbf24"/>
  
  <!-- Checkmark -->
  <path d="M 216 364 L 238 386 L 296 338" fill="none" stroke="#22c55e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
